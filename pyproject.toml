[project]
name = "resume-rebuilder"
version = "0.1.0"
description = "Local-first editable resume reconstruction"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pdfplumber>=0.11,<0.12", "pypdfium2>=4.30,<6", "Pillow>=11,<13",
  "rapidocr>=3,<4", "onnxruntime>=1.20,<2", "playwright>=1.50,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "reportlab>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
